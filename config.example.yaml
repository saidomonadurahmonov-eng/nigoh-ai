# NIGOH AI — namuna konfiguratsiya / example configuration
# Bu faylni `config.yaml` deb nusxalab, o'z qiymatlaringizni yozing.
# Copy this file to `config.yaml` and fill in your own values.
# HECH QACHON haqiqiy config.yaml ni git'ga qo'shmang (.gitignore da).

# --- Video manbasi: NVR (Hikvision ISAPI JPEG) ---
# Kadr NVR'dan ISAPI JPEG snapshot orqali olinadi — RTSP H.264/H.265 dekod
# ("yashil kadr") muammosi butunlay chetlab o'tiladi.
nvr:
  ip: 192.168.1.64
  user: admin
  pass: "PAROLNI_SHU_YERGA"

# --- Kameralar ---
# channel: NVR kanal raqami (1..N).
#   line: virtual chiziq [[x1,y1],[x2,y2]] — kesib o'tganlar kirdi/chiqdi
#   zone: poligon [[x,y], ...] — ichidagilar soni + kutish vaqti
#   ikkalasi ham bo'lmasa — kadrdagi odamlar soni (bandlik) sanaladi
# Koordinata IKKI xil yozilishi mumkin:
#   nisbiy  — 0..1 oralig'ida, kadr o'lchamiga nisbatan (TAVSIYA: kadr o'lchami
#             o'zgarsa ham chiziq o'z joyida qoladi), masalan [[0.12, 0.44], [0.73, 0.38]]
#   piksel  — tahlil kadri o'lchamida (substream x02, odatda 704x576)
cameras:
  kirish:
    channel: 1
    fps: 3
    line: [[0.12, 0.44], [0.73, 0.38]]
  kassa:
    channel: 6
    fps: 3
    zone: [[0.26, 0.43], [0.67, 0.41], [0.85, 0.83], [0.34, 0.97]]

# NVR o'rniga oddiy webkamera yoki video fayl bilan sinash uchun:
# source: 0            # webkamera
# source: sinov.mp4    # fayl

# --- Telegram ---
telegram:
  token: ""            # @BotFather bergan token
  chat_id: ""          # tools/chat_id.py chiqargan raqam
  rasm: true           # alert bilan surat yuborilsinmi

db: analitika.db
arxiv: kassa_arxiv     # so'rov bo'lganda kesiladigan kadr arxivi

kirish_kamera: kirish  # kunlik hisobot grafigi shu kameradan
kassa_kamera: kassa    # dalil videosi shu kameradan
hisobot_soat: 21       # kunlik hisobot vaqti
arxiv_kun: 14          # arxiv necha kun saqlanadi

# --- Odam qidiruv (rasm bo'yicha) va hodim yuz ID ---
# Ikkalasi ham ixtiyoriy. Maxfiylik uchun o'chirib qo'yish mumkin: false
odam_indeks: true      # odamlarning tashqi ko'rinish "barmoq izi" (qidiruv uchun)
indeks_kun: 14         # namunalar necha kun saqlanadi
hodim_yuz: true        # ro'yxatdagi hodimlarni yuzidan tanish (davomat, "notanish")

# --- Lokal Mini App ---
# Server faqat telegram.token va chat_id to'ldirilgan bo'lsa ishga tushadi.
webapp_port: 8770
webapp_host: 0.0.0.0   # faqat shu kompyuterdan ochilsin desangiz: 127.0.0.1
webapp_dev: false      # true = ruxsat tekshirilmaydi, server faqat 127.0.0.1 da (sinov uchun)
webapp_url: ""

# --- Gibrid rejim: Mini App bulutda, agent obyektdan tashqariga ulanadi ---
# Obyekt kompyuteri internetga OCHILMAYDI — faqat o'zi tashqariga so'rov yuboradi.
railway_url: ""
agent_secret: ""       # bulut ENV AGENT_SECRET bilan bir xil bo'lsin

# --- Qoidalar: chegara + davomiylik + cooldown ---
# xabar ichida: {navbat} {kutish} {ichkarida} {kirdi} {chiqdi} {kadrda} {kamera}
# soat_dan / soat_gacha — qoida faqat shu soatlar oralig'ida ishlaydi
# (yarim tundan o'tadigan oraliq ham bo'ladi: 21 -> 8).
rules:
  - name: navbat_uzun
    kamera: kassa
    metrika: navbat
    chegara: 3
    davomiylik: 45
    cooldown: 900
    xabar: "Kassada navbat: {navbat} kishi, kutish {kutish}s."
  - name: ishdan_tashqari
    kamera: kirish
    metrika: kadrda
    chegara: 1
    davomiylik: 5
    cooldown: 900
    soat_dan: 21
    soat_gacha: 8
    xabar: "ISHDAN TASHQARI HARAKAT! {kamera}: {kadrda} kishi"
